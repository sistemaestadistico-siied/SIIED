{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Don Datico · Misiones SIIED</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'indicadores/arena/arena.css' %}">
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
}
</script>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="brand">
    <img class="siied" src="{% static 'indicadores/images/unnamed.png' %}" alt="SIIED">
    <img class="planea" src="{% static 'indicadores/images/planeación.png' %}" alt="Planeación">
  </div>
  <div id="obj"><div id="objtext">—</div><canvas id="compass" width="360" height="26"></canvas></div>
  <div id="tr">
    <div id="timer">00:00</div>
    <div id="score">PUNTOS 000000</div>
    <div id="fps">60 FPS</div>
  </div>
  <div id="feed"></div>
  <div id="kfeed"></div>
  <div id="hp"><div id="hpnum"><span>INTEGRIDAD 100%</span><span>DT-7</span></div><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="ammo">
    <div id="wname">LECTOR DT-7 · SIIED</div>
    <div id="magnum">30<small>/30</small></div>
    <div id="magbar"><div id="magfill"></div></div>
    <div id="maghint"></div>
  </div>
  <div id="cross">
    <div class="dot"></div>
    <div class="arm t"></div><div class="arm b"></div><div class="arm l"></div><div class="arm r"></div>
    <div id="hitm"></div>
  </div>
  <div id="darcs"></div>
  <div id="bandera"></div>
</div>
<div id="wmarks"></div>
<div id="vign"></div>

<div id="loading">
  <div class="logos">
    <img class="siied" src="{% static 'indicadores/images/unnamed.png' %}" alt="SIIED">
    <img class="planea" src="{% static 'indicadores/images/planeación.png' %}" alt="Planeación">
  </div>
  <div class="lt">DON DATICO · MISIONES</div>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div class="lp" id="loadmsg">CARGANDO RECURSOS</div>
</div>

<script>
  window.GLB_URL = "{% static 'indicadores/models/dondaticolite.glb' %}";
  window.DD_STATIC = "{% static '' %}";
</script>
<script type="module" src="{% static 'indicadores/arena/main.js' %}"></script>
</body>
</html>
