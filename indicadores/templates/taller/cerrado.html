<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro cerrado · Taller Gestión de Datos Institucionales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #003a66 0%, #155e75 50%, #0891b2 100%);
        }
        .card {
            background: rgba(255,255,255,0.97); border-radius: 16px;
            padding: 48px 44px; max-width: 480px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icono { font-size: 52px; margin-bottom: 16px; }
        h1 { color: #155e75; font-size: 22px; font-weight: 800; margin-bottom: 12px; }
        p { color: #4a5568; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
        .fecha { color: #0891b2; font-weight: 700; }
        .admin-link {
            display: inline-block; margin-top: 18px; font-size: 12px;
            color: #a0aec0; text-decoration: none;
        }
        .admin-link:hover { color: #155e75; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icono">🔒</div>
        <h1>El registro ha cerrado</h1>
        <p>El periodo para diligenciar las fichas del taller
           <strong>Gestión de Datos Institucionales</strong> ha finalizado.</p>
        <p>Gracias a todos los equipos que participaron. Los resultados se
           presentarán en el taller del <span class="fecha">15 de septiembre de 2026</span>.</p>
        <a class="admin-link" href="/admin/">Acceso administrativo →</a>
    </div>
</body>
</html>
