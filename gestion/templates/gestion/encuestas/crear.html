{% extends 'gestion/base_gestion.html' %}
{% block title %}Nuevo formulario{% endblock %}
{% block gs_titulo %}Nuevo formulario{% endblock %}
{% block gs_miga %}<span class="mx-1">›</span><a href="{% url 'gestion:encuestas_lista' %}">Encuestas</a>{% endblock %}

{% block gs_contenido %}
<div class="max-w-xl">
  <form method="post" class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1" for="titulo">Título *</label>
      <input type="text" name="titulo" id="titulo" required value="{{ post.titulo }}"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1" for="tipo">Tipo *</label>
      <select name="tipo" id="tipo" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        {% for c, t in tipos %}<option value="{{ c }}" {% if post.tipo == c %}selected{% endif %}>{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1" for="descripcion">Descripción</label>
      <textarea name="descripcion" id="descripcion" rows="3"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">{{ post.descripcion }}</textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="px-5 py-2.5 rounded-lg bg-teal-600 text-white text-sm font-semibold hover:bg-teal-700 active:scale-[0.98] transition">Crear y abrir constructor</button>
      <a href="{% url 'gestion:encuestas_lista' %}" class="px-5 py-2.5 rounded-lg border border-slate-300 text-sm font-medium hover:bg-slate-50">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
