{% extends 'indicadores/base.html' %}
{% block title %}Gracias{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-teal-50/40 flex items-center justify-center py-10">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-10 max-w-md text-center">
    <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl mx-auto mb-4">
      <i class="fas fa-check"></i>
    </div>
    <h1 class="text-2xl font-bold text-slate-900">¡Gracias!</h1>
    <p class="text-slate-500 mt-2">Su respuesta a «{{ f.titulo }}» quedó registrada.</p>
    <p class="text-xs text-slate-400 mt-4">Referencia del envío: #{{ envio.pk }}</p>
  </div>
</div>
{% endblock %}
