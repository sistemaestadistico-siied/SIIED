{% load encuestas_tags %}
<div class="bg-white rounded-xl border border-slate-200 p-5 mb-4">
  <label class="block text-sm font-semibold text-slate-800 mb-1">
    {{ p.enunciado }}{% if p.obligatoria %} <span class="text-rose-500">*</span>{% endif %}
  </label>
  {% if p.ayuda %}<p class="text-xs text-slate-400 mb-2">{{ p.ayuda }}</p>{% endif %}
  {% if valor|get:'nombre' %}
  <p class="text-xs text-emerald-600 mb-1"><i class="fas fa-paperclip mr-1"></i>{{ valor|get:'nombre' }}</p>
  {% endif %}
  <input type="file" name="p_{{ p.pk }}"
         {% if p.config.extensiones %}accept="{{ p.config.extensiones|join:'.' }}"{% endif %}
         class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-teal-50 file:text-teal-700 file:text-xs file:font-semibold">
  <p class="text-[11px] text-slate-400 mt-1">Máx. {{ p.config.max_mb|default:5 }} MB.</p>
</div>
